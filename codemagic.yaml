# Codemagic CI: builds the iOS app on a cloud Mac and uploads it to
# TestFlight. Started MANUALLY from codemagic.io (Start new build) so pushes
# during development don't burn build minutes. Full walkthrough:
# JonWesOBVault/"how to make android app available for iPhone.md".
#
# Requirements wired up once in the Codemagic UI:
# - GitHub repo connected (Codemagic app added from this repository)
# - Developer Portal integration holding the App Store Connect API key,
#   saved under the exact name "AppStoreConnect" (referenced below)
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      ios_signing:
        # Codemagic fetches or CREATES the distribution certificate and
        # App Store provisioning profile through the API key — no Mac, no
        # Keychain, nothing to export by hand.
        distribution_type: app_store
        bundle_identifier: com.jonwes.pokemonStrategyApp
      flutter: stable
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          # CFBundleVersion must be unique per TestFlight upload;
          # PROJECT_BUILD_NUMBER is Codemagic's own ever-increasing counter
          # for this app, so every build is automatically newer.
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload the build to TestFlight and wait for Apple's processing.
        submit_to_testflight: true
        # Once the "Friends" external tester group exists in App Store
        # Connect, uncomment so every new build lands in it automatically:
        # beta_groups:
        #   - Friends
