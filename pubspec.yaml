name: pokemon_strategy_app
description: Battle companion for Pokemon Champions — team builder, snapshot recognition, battle intel.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # API recognizer (Anthropic / OpenAI-compatible) + future data-pack refresh.
  # Only cloud_vision_recognizer.dart and tool/update_data.dart touch it.
  http: ^1.2.0
  # Local (on-device) recognition: pure-Dart sprite matching for the
  # team-preview screen. Used by sprite_matcher.dart only.
  image: ^4.3.0
  # On-device OCR of battle-screen name banners (Local engine, battle tab).
  # Imported ONLY by mlkit_ocr.dart.
  google_mlkit_text_recognition: ^0.13.1
  # Camera capture + gallery import for snapshots. Imported ONLY by
  # capture_screen.dart.
  camera: ^0.11.0
  image_picker: ^1.1.2
  # Documents directory for the persisted exemplar library.
  path_provider: ^2.1.4
  # Persistent storage: teams and settings (AppDatabase). Same stack as
  # GolfSwingTrackerApp: sqflite on-device, sqflite_common pure-Dart types
  # so the database layer stays testable without a phone.
  sqflite: ^2.4.1
  sqflite_common: ^2.5.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Runs AppDatabase against real SQLite in plain unit tests (no device).
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/sprites/
    - assets/sprites/home/
    - assets/sprites/icons/
    - assets/exemplars/
