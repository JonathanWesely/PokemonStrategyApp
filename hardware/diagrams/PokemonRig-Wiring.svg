<svg xmlns="http://www.w3.org/2000/svg" width="960" height="596" viewBox="0 0 960 596" role="img" aria-label="Cordless wiring: battery, inline switch, XIAO BAT pads">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f2933"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c0392b"/></marker>
  <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b7280"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#15803d"/></marker>
  <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#9ca3af" stroke-width="2.5"/></pattern>
</defs>
<rect width="960" height="596" fill="#ffffff"/>
<text x="24.0" y="32.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="700">Cordless wiring — battery → switch → BAT pads</text>
<text x="24.0" y="52.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Four glue joints total: two BAT pads + two switch pins. The kit's switches have solid PCB pins (no holes), so each wire gets</text>
<text x="24.0" y="68.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">4–5 tight turns wrapped around the pin with pliers, then glue over the coil. Use an SS12D00G5 — smallest body, 0.5 A / 50 V.</text>
<text x="710.0" y="96.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">③ XIAO ESP32S3 — underside</text>
<rect x="560.0" y="108.0" width="300.0" height="130.0" rx="8" fill="#eef2ff" stroke="#1f2933" stroke-width="1.8"/>
<rect x="572.0" y="100.0" width="14.0" height="9.0" rx="1" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.8"/>
<rect x="610.0" y="100.0" width="14.0" height="9.0" rx="1" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.8"/>
<rect x="648.0" y="100.0" width="14.0" height="9.0" rx="1" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.8"/>
<rect x="686.0" y="100.0" width="14.0" height="9.0" rx="1" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.8"/>
<rect x="724.0" y="100.0" width="14.0" height="9.0" rx="1" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.8"/>
<rect x="762.0" y="100.0" width="14.0" height="9.0" rx="1" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.8"/>
<rect x="800.0" y="100.0" width="14.0" height="9.0" rx="1" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.8"/>
<rect x="856.0" y="152.0" width="26.0" height="44.0" rx="6" fill="#9ca3af" stroke="#1f2933" stroke-width="1.6"/>
<text x="869.0" y="214.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="700">USB-C</text>
<text x="582.0" y="142.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="400">(component side faces DOWN</text>
<text x="582.0" y="155.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="400">once it's seated in the pod)</text>
<rect x="630.0" y="227.0" width="38.0" height="22.0" rx="2" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<rect x="732.0" y="227.0" width="38.0" height="22.0" rx="2" fill="#111827" stroke="#111827" stroke-width="1"/>
<text x="649.0" y="207.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">BAT +</text>
<text x="751.0" y="207.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">BAT −</text>
<text x="649.0" y="220.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400">farther from USB-C</text>
<text x="751.0" y="220.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#1f2933" text-anchor="middle" font-weight="700">nearer USB-C</text>
<line x1="668.0" y1="232.0" x2="732.0" y2="232.0" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/>
<path d="M700.0,187 L700.0,230" fill="none" stroke="#6b7280" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 2"/>
<text x="700.0" y="175.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">~2 mm apart —</text>
<text x="700.0" y="186.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">never bridge them</text>
<text x="93.0" y="236.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">① Battery</text>
<rect x="28.0" y="246.0" width="130.0" height="96.0" rx="6" fill="#f3f4f6" stroke="#1f2933" stroke-width="1.8"/>
<rect x="37.0" y="255.0" width="112.0" height="78.0" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
<text x="93.0" y="290.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">EEMB 502030</text>
<text x="93.0" y="307.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">3.7 V · 250 mAh</text>
<line x1="158.0" y1="268.0" x2="196.0" y2="268.0" stroke="#c0392b" stroke-width="3.2" stroke-linecap="round"/>
<line x1="158.0" y1="306.0" x2="196.0" y2="306.0" stroke="#111827" stroke-width="3.2" stroke-linecap="round"/>
<text x="160.0" y="259.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">red +</text>
<text x="160.0" y="325.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="700">black −</text>
<rect x="196.0" y="254.0" width="24.0" height="66.0" rx="3" fill="#fff" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="208.0" y="338.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400">JST plug</text>
<text x="208.0" y="350.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="400">cut off</text>
<line x1="183.0" y1="259.0" x2="193.0" y2="277.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="183.0" y1="277.0" x2="193.0" y2="259.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="183.0" y1="297.0" x2="193.0" y2="315.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="183.0" y1="315.0" x2="193.0" y2="297.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<text x="332.0" y="176.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700">② Slide switch (SPDT)</text>
<rect x="262.0" y="192.0" width="140.0" height="44.0" rx="5" fill="#f3f4f6" stroke="#1f2933" stroke-width="1.8"/>
<rect x="306.0" y="176.0" width="52.0" height="18.0" rx="3" fill="#d1d5db" stroke="#1f2933" stroke-width="1.4"/>
<text x="332.0" y="219.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">slide</text>
<line x1="288.0" y1="236.0" x2="288.0" y2="272.0" stroke="#1f2933" stroke-width="3.4" stroke-linecap="round"/>
<line x1="332.0" y1="236.0" x2="332.0" y2="272.0" stroke="#1f2933" stroke-width="3.4" stroke-linecap="round"/>
<line x1="376.0" y1="236.0" x2="376.0" y2="272.0" stroke="#1f2933" stroke-width="3.4" stroke-linecap="round"/>
<path d="M327,248 Q332,245 337,248" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M327,252 Q332,249 337,252" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M327,256 Q332,253 337,256" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M327,260 Q332,257 337,260" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M371,248 Q376,245 381,248" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M371,252 Q376,249 381,252" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M371,256 Q376,253 381,256" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M371,260 Q376,257 381,260" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="282.0" y1="244.0" x2="294.0" y2="256.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="282.0" y1="256.0" x2="294.0" y2="244.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<text x="274.0" y="254.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#c0392b" text-anchor="end" font-weight="700">clip</text>
<text x="358.0" y="330.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="middle" font-weight="700">centre pin = COMMON (in from battery)</text>
<text x="358.0" y="344.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">one outer pin = OUT to BAT+ · clip the third</text>
<path d="M220,268 L332,268" fill="none" stroke="#c0392b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M376,268 L649,268 L649,249" fill="none" stroke="#c0392b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M220,306 L751,306 L751,249" fill="none" stroke="#111827" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="28.0" y="360.0" width="268.0" height="62.0" rx="8" fill="#fee2e2" stroke="#c0392b" stroke-width="1.3"/>
<text x="42.0" y="382.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#991b1b" text-anchor="start" font-weight="700">⚠  Cut ONE lead at a time</text>
<text x="42.0" y="401.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="400">Snipping both at once shorts the cell</text>
<text x="42.0" y="415.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#991b1b" text-anchor="start" font-weight="400">across the blades — sparks.</text>
<rect x="312.0" y="360.0" width="250.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<text x="326.0" y="382.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#92400e" text-anchor="start" font-weight="700">Clip the unused third pin</text>
<text x="326.0" y="401.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">In the OFF position it sits at battery +</text>
<text x="326.0" y="415.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#92400e" text-anchor="start" font-weight="400">potential — a bare pin waiting to short.</text>
<rect x="578.0" y="360.0" width="354.0" height="84.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="594.0" y="382.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14532d" text-anchor="start" font-weight="700">Polarity rule — from Seeed's wiki:</text>
<text x="594.0" y="402.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#14532d" text-anchor="start" font-weight="700">NEGATIVE is the pad closest to USB-C.</text>
<text x="594.0" y="420.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#14532d" text-anchor="start" font-weight="400">Positive is the pad farther away. Confirm against</text>
<text x="594.0" y="435.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#14532d" text-anchor="start" font-weight="400">your own board first — reversing it kills the XIAO.</text>
<line x1="24.0" y1="470.0" x2="936.0" y2="470.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="24.0" y="492.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="700">Also true of this wiring</text>
<text x="24.0" y="512.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">•  USB-C still charges the cell once it's attached — built-in charger at 100 mA, empty-to-full ≈ 3 h, and streaming while charging is fine.</text>
<text x="24.0" y="529.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">•  The switch earns its place: this firmware never sleeps (~60–100 mA idle), so a hardwired cell would drain in a few hours on the shelf.</text>
<text x="24.0" y="546.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">•  Route both wires toward the pod's divider gap before the board goes in — never trapped under the Sense expansion board.</text>
<text x="24.0" y="563.0" font-family="ui-sans-serif, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">•  The printed pod has no switch pocket: glue the switch flat on the OUTSIDE of the pod's rear end wall, handle up. Both docks stay clear of it.</text>
</svg>
